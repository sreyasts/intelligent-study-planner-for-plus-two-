name: CI & Build Verification

on:
  push:
    branches: [main, master, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Validate Curriculum JSON Schemas
        run: npx vitest run tests/curriculum-schema.test.js

      - name: Run Invariant Regression Suite (500+ Checks)
        run: npm run test:legacy

      - name: Run Planner Benchmark Verification
        run: node scripts/benchmark-planner.js

      - name: Build Production Web App (Vite)
        run: npm run build
