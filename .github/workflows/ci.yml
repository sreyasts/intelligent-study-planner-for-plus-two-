name: CI & Build Verification

on:
  push:
    branches: [main, master, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Validate Curriculum JSON Schemas
        run: npx vitest run tests/curriculum-schema.test.js

      - name: Run Invariant Regression Suite (500+ Checks)
        run: npm run test:legacy

      - name: Set up Java for Firestore rule checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify real Firestore security rules
        run: npm run test:sync-rules

      - name: Run Planner Benchmark Verification
        run: node scripts/benchmark-planner.js

      - name: Build Production Web App (Vite)
        run: npm run build

      - name: Install browser for UI and offline checks
        run: npx playwright install --with-deps chromium

      - name: Verify guest study flow and offline reload
        run: npm run test:e2e -- --workers=1
